<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventário · Transferências</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <script>if (!localStorage.getItem('access_token')) { const r = encodeURIComponent(location.pathname + location.search); window.location.href = '/login.html?redirect=' + r; }</script>
</head>
<body class="bg-white">
<div id="layoutRoot"></div>
<script src="_layout.js"></script>
<script src="_searchable-select.js"></script>
<script>
renderInventoryLayout({ activePage: 'transfers', title: 'Consumo · Transferências', subtitle: 'Movimentação de stock de consumo entre localizações (gera 2 movimentos)' });

document.getElementById('pageContent').innerHTML = `
    <div class="flex justify-between items-center mb-4">
        <h3 class="text-base font-bold text-gray-900">Histórico de transferências</h3>
        <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-sm shadow-indigo-500/20 transition flex items-center gap-2"><i class="fas fa-right-left"></i> Nova transferência</button>
    </div>
    <div class="bg-white rounded-xl border border-gray-200/70 shadow-sm overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-gray-50/50 text-[10px] uppercase tracking-wider text-gray-500 border-b border-gray-200">
                <tr><th class="text-left p-3">Data/hora</th><th class="text-left p-3">Item</th><th class="text-right p-3">Qtd</th><th class="text-left p-3">De</th><th class="text-left p-3">Para</th><th class="text-left p-3">Lote</th><th class="text-left p-3">Justificação</th><th class="text-center p-3">Ações</th></tr>
            </thead>
            <tbody id="tbody" class="divide-y divide-gray-50"></tbody>
        </table>
    </div>

    <div id="modal" class="hidden fixed inset-0 bg-gray-900/40 backdrop-blur-[2px] z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl border border-gray-200 shadow-2xl max-w-5xl w-full max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center p-4 border-b">
                <h3 class="font-bold text-gray-800">Nova transferência</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
            </div>
            <form id="form" class="p-6 space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-gray-500">Origem *</label>
                        <select name="from_location_id" id="fromSelect" required onchange="onOriginChange()" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                            <option value="">—</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-gray-500">Destino *</label>
                        <select name="to_location_id" id="toSelect" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm">
                            <option value="">—</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="text-xs text-gray-500">Justificação (recomendada)</label>
                    <textarea name="justification" rows="2" placeholder="Motivo da transferência…" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm"></textarea>
                </div>

                <div class="border border-gray-200 rounded-lg p-4">
                    <div class="flex justify-between items-center mb-3">
                        <h4 class="font-bold text-gray-800">Itens</h4>
                        <button type="button" onclick="addLine()" class="text-sm bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-lg"><i class="fas fa-plus"></i> Adicionar linha</button>
                    </div>
                    <div id="lines" class="space-y-2"></div>
                    <p class="text-[11px] text-gray-400 mt-2">Disponibilidade e lotes são da <b>origem</b> escolhida. Lote por <b>FEFO automático</b> — ou escolha um específico quando houver.</p>
                </div>

                <div class="flex justify-end gap-2 border-t pt-4">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-lg">Cancelar</button>
                    <button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium shadow-sm shadow-indigo-500/20 transition flex items-center gap-2"><i class="fas fa-save"></i> Executar transferência</button>
                </div>
            </form>
        </div>
    </div>
`;

let items = [], locations = [];
const lineStock = {};   // idx -> stock-by-item (linhas de stock)
let lineCounter = 0;

async function bootstrap() {
    try {
        const [it, lo] = await Promise.all([
            apiCall('/api/inventory/items?macro_category=consumo&limit=1000'),
            apiCall('/api/inventory/locations')
        ]);
        items = it.data || [];
        locations = (lo.data || []).filter(l => l.is_active !== false);
        document.getElementById('fromSelect').innerHTML = locationOptionsHTML(locations, { filter: l => l.can_send    !== false });
        document.getElementById('toSelect').innerHTML   = locationOptionsHTML(locations, { filter: l => l.can_receive !== false });
        makeSearchable('fromSelect', { placeholder: 'Buscar origem…' });
        makeSearchable('toSelect',   { placeholder: 'Buscar destino…' });
    } catch (err) { toast(err.message, 'error'); }
}

async function load() {
    try {
        const r = await apiCall('/api/inventory/transfers?limit=100');
        document.getElementById('tbody').innerHTML = r.data.map(m => `
            <tr class="hover:bg-sky-50/30 transition">
                <td class="p-3 text-xs">${new Date(m.occurred_at).toLocaleString('pt-PT')}</td>
                <td class="p-3 font-medium">${escapeHtml(m.item?.name || '')}<br><span class="text-[10px] text-gray-400 font-mono">${escapeHtml(m.item?.internal_code || '')}</span></td>
                <td class="p-3 text-right">${parseFloat(m.quantity).toFixed(2)}</td>
                <td class="p-3 text-xs text-gray-600">${escapeHtml(m.from_location?.unit?.name || '')} · ${escapeHtml(m.from_location?.name || '')}</td>
                <td class="p-3 text-xs text-gray-600">${escapeHtml(m.to_location?.unit?.name || '')} · ${escapeHtml(m.to_location?.name || '')}</td>
                <td class="p-3 text-xs">${m.lot ? escapeHtml(m.lot.lot_number) : '—'}</td>
                <td class="p-3 text-xs text-gray-600 max-w-[200px] truncate" title="${escapeHtml(m.justification || '')}">${escapeHtml(m.justification || '—')}</td>
                <td class="p-3 text-center">
                    <button onclick='viewTransfer(${JSON.stringify(m).replace(/'/g, "&#39;")})' class="text-gray-600 hover:text-blue-600" title="Visualizar"><i class="fas fa-eye"></i></button>
                </td>
            </tr>`).join('') || '<tr><td colspan="8" class="p-6 text-center text-gray-400">Nenhuma transferência registada.</td></tr>';
    } catch (err) { toast(err.message, 'error'); }
}

function addLine() {
    const idx = lineCounter++;
    const div = document.createElement('div');
    div.className = 'grid grid-cols-12 gap-2 items-end p-2 border border-gray-100 rounded-lg';
    div.dataset.line = idx;
    div.innerHTML = `
        <div class="col-span-5"><label class="text-xs text-gray-500">Item</label>
            <select required onchange="onLineItemChange(this, ${idx})" class="line-item w-full px-2 py-1.5 border border-gray-300 rounded text-xs" id="trItem-${idx}">
                <option value="">—</option>
                ${items.map(i => `<option value="${i.id}" data-controls-lot="${i.controls_lot}">${escapeHtml(i.internal_code)} · ${escapeHtml(i.name)}${i.subcategory?.name ? ' · ' + escapeHtml(i.subcategory.name) : ''}</option>`).join('')}
            </select>
        </div>
        <div class="col-span-3"><label class="text-xs text-gray-500 flex items-center gap-1">Qtd <span class="line-avail text-[10px] text-gray-400"></span></label>
            <input type="number" step="0.0001" required class="line-qty w-full px-2 py-1.5 border border-gray-300 rounded text-xs"></div>
        <div class="col-span-3 line-lot-area hidden"><label class="text-xs text-gray-500">Lote</label>
            <select class="line-lot w-full px-2 py-1.5 border border-gray-300 rounded text-xs"><option value="">— FEFO automático —</option></select></div>
        <div class="col-span-1 flex items-center justify-center"><button type="button" onclick="this.closest('[data-line]').remove()" class="text-red-500 hover:text-red-700" title="Remover linha"><i class="fas fa-trash"></i></button></div>
        <p class="line-hint col-span-12 text-[11px] text-gray-400 mt-0.5 leading-snug"></p>`;
    document.getElementById('lines').appendChild(div);
    makeSearchable(`trItem-${idx}`, { placeholder: 'Buscar item por nome, código ou categoria…' });
}

async function onLineItemChange(sel, idx) {
    const line = sel.closest('[data-line]');
    line.querySelector('.line-avail').textContent = '';
    lineStock[idx] = [];
    if (sel.value) {
        try {
            const r = await apiCall(`/api/inventory/exits/stock-by-item/${sel.value}`);
            lineStock[idx] = (r.data || []).filter(s => !r.seeding_mode); // ignora localizações sintéticas (seeding)
        } catch (_) { /* sem stock: seeding permite negativo; backend valida no submit */ }
    }
    rebuildLineLot(line, idx);
}

// Mostra ONDE o item tem stock (todas as localizações com saldo > 0), realçando
// a origem escolhida. Guia o operador a escolher a origem certa — a causa nº 1 de
// "não aparece o lote" é escolher uma origem que não tem stock deste item.
function renderLineHint(line, idx) {
    const hint = line.querySelector('.line-hint');
    if (!hint) return;
    const fromId = document.getElementById('fromSelect').value;
    const all = lineStock[idx] || [];
    if (!all.length) { hint.innerHTML = ''; return; }

    const byLoc = {};
    for (const s of all) {
        const g = byLoc[s.location_id] || (byLoc[s.location_id] = {
            name: `${s.location?.unit?.name ? s.location.unit.name + ' · ' : ''}${s.location?.name || ''}`,
            qty: 0, lots: []
        });
        g.qty += parseFloat(s.quantity || 0);
        if (s.lot) g.lots.push(s.lot.lot_number);
    }
    const parts = Object.entries(byLoc).map(([id, v]) =>
        `<span class="${id === fromId ? 'text-sky-600 font-semibold' : ''}">${escapeHtml(v.name)} (${v.qty.toFixed(2)}${v.lots.length ? ' · lote ' + v.lots.map(escapeHtml).join('/') : ''})</span>`);
    hint.innerHTML = '<i class="fas fa-boxes-stacked text-gray-300 mr-1"></i>Em stock: ' + parts.join(' &nbsp;·&nbsp; ');
}

// Origem mudou → recalcula disponibilidade/lotes de TODAS as linhas.
function onOriginChange() {
    const fromId = document.getElementById('fromSelect').value;
    const toSel = document.getElementById('toSelect');
    if (toSel.value && toSel.value === fromId) { toSel.value = ''; toSel.dispatchEvent(new Event('change', { bubbles: true })); }
    for (const line of document.querySelectorAll('[data-line]')) {
        rebuildLineLot(line, parseInt(line.dataset.line, 10));
    }
}

function rebuildLineLot(line, idx) {
    const fromId = document.getElementById('fromSelect').value;
    const itemChosen = !!line.querySelector('.line-item')?.value;
    const here = (lineStock[idx] || []).filter(s => s.location_id === fromId);
    const total = here.reduce((a, s) => a + parseFloat(s.quantity || 0), 0);
    const avail = line.querySelector('.line-avail');
    if (avail) {
        avail.textContent = fromId ? `· disp ${total.toFixed(2)}` : '';
        // Origem escolhida + item escolhido, mas sem saldo aqui → avisa (a causa
        // comum de "não aparece o lote"): o stock está noutra localização.
        avail.className = 'line-avail text-[10px] ' +
            (fromId && itemChosen && total <= 0 ? 'text-red-500 font-semibold' : 'text-gray-400');
    }

    renderLineHint(line, idx);

    const lots = here.filter(s => s.lot).sort((a, b) =>
        (a.lot.expiry_date || '9999-12-31').localeCompare(b.lot.expiry_date || '9999-12-31'));
    const lotSel = line.querySelector('.line-lot');
    line.querySelector('.line-lot-area').classList.toggle('hidden', lots.length === 0);
    lotSel.innerHTML = '<option value="">— FEFO automático —</option>' +
        lots.map((s, i) => `<option value="${s.lot.id}">${escapeHtml(s.lot.lot_number)} · ${parseFloat(s.quantity).toFixed(2)}${s.lot.expiry_date ? ' · val ' + s.lot.expiry_date : ''}${i === 0 ? ' 🟢' : ''}</option>`).join('');
}

function openModal() {
    document.getElementById('form').reset();
    document.getElementById('lines').innerHTML = '';
    for (const k in lineStock) delete lineStock[k];
    addLine();
    document.getElementById('modal').classList.remove('hidden');
}

function closeModal() { document.getElementById('modal').classList.add('hidden'); }

document.getElementById('form').addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target;
    const from_location_id = f.from_location_id.value;
    const to_location_id   = f.to_location_id.value;
    if (!from_location_id || !to_location_id) { toast('Escolha origem e destino', 'error'); return; }
    if (from_location_id === to_location_id) { toast('Origem e destino não podem ser iguais', 'error'); return; }

    const lines = [];
    for (const div of document.querySelectorAll('[data-line]')) {
        const item_id = div.querySelector('.line-item').value;
        if (!item_id) continue;
        lines.push({
            item_id,
            quantity: parseFloat(div.querySelector('.line-qty').value),
            lot_id:   div.querySelector('.line-lot')?.value || null
        });
    }
    if (!lines.length) { toast('Adicione pelo menos uma linha', 'error'); return; }

    const payload = { from_location_id, to_location_id, justification: f.justification.value || null, lines };
    try {
        const r = await apiCall('/api/inventory/transfers/batch', { method: 'POST', body: JSON.stringify(payload) });
        toast(`${r.data.count} transferência(s) executada(s)`);
        closeModal();
        load();
    } catch (err) { toast(err.message, 'error'); }
});

function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function viewTransfer(m) {
    const from = m.from_location ? `${m.from_location.unit?.name || ''} · ${m.from_location.name}` : null;
    const to   = m.to_location   ? `${m.to_location.unit?.name   || ''} · ${m.to_location.name}`   : null;
    showViewModal({
        title: 'Transferência interna',
        sections: [
            { title: 'Dados gerais', rows: [
                ['Data/hora', new Date(m.occurred_at).toLocaleString('pt-PT')],
                ['Item', `${m.item?.internal_code || ''} · ${m.item?.name || ''}`],
                ['Quantidade', parseFloat(m.quantity).toFixed(4), { bold: true }],
                ['Origem', from],
                ['Destino', to],
                ['Lote', m.lot?.lot_number, { mono: true }],
                ['Validade do lote', m.lot?.expiry_date],
                ['Custo Médio', `€ ${parseFloat(m.cmp_at_moment || 0).toFixed(4)}`]
            ]},
            { title: 'Justificação', rows: [
                ['Texto', m.justification]
            ]}
        ]
    });
}

(async () => { await bootstrap(); await load(); })();
</script>
</body>
</html>
