<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventário · Documentação</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
    <script>if (!localStorage.getItem('access_token')) { const r = encodeURIComponent(location.pathname + location.search); window.location.href = '/login.html?redirect=' + r; }</script>
    <style>
        /* Estilo de leitura do manual (marked gera HTML puro) */
        #docContent { color: #1f2937; font-size: 15px; line-height: 1.65; }
        #docContent h1 { font-size: 1.7rem; font-weight: 700; margin: 0 0 .8rem; color: #0f172a; }
        #docContent h2 { font-size: 1.3rem; font-weight: 700; margin: 1.6rem 0 .6rem; color: #0f172a; border-bottom: 1px solid #eef2f7; padding-bottom: .3rem; }
        #docContent h3 { font-size: 1.08rem; font-weight: 600; margin: 1.2rem 0 .4rem; color: #0f172a; }
        #docContent p { margin: .6rem 0; }
        #docContent ul, #docContent ol { margin: .5rem 0 .5rem 1.4rem; }
        #docContent li { margin: .25rem 0; }
        #docContent ul { list-style: disc; } #docContent ol { list-style: decimal; }
        #docContent a { color: #0284c7; text-decoration: none; } #docContent a:hover { text-decoration: underline; }
        #docContent code { background: #f1f5f9; padding: .1rem .35rem; border-radius: .25rem; font-family: 'Courier New', monospace; font-size: .88em; }
        #docContent pre { background: #0f172a; color: #e2e8f0; padding: 1rem; border-radius: .5rem; overflow-x: auto; }
        #docContent pre code { background: transparent; color: inherit; padding: 0; }
        #docContent blockquote { border-left: 3px solid #38bdf8; background: #f0f9ff; padding: .5rem .9rem; margin: .8rem 0; border-radius: 0 .4rem .4rem 0; color: #075985; }
        #docContent table { border-collapse: collapse; width: 100%; margin: .8rem 0; display: block; overflow-x: auto; }
        #docContent th, #docContent td { border: 1px solid #e5e7eb; padding: .45rem .7rem; text-align: left; font-size: .9em; }
        #docContent th { background: #f8fafc; font-weight: 600; }
        #docContent img { max-width: 100%; border: 1px solid #e5e7eb; border-radius: .5rem; margin: .6rem 0; }
        #docContent hr { border: 0; border-top: 1px solid #eef2f7; margin: 1.4rem 0; }
    </style>
</head>
<body class="bg-white">
<div id="layoutRoot"></div>
<script src="_layout.js"></script>
<script>
renderInventoryLayout({ activePage: 'docs', title: 'Documentação', subtitle: 'Manual do utilizador do módulo Inventário' });

document.getElementById('pageContent').innerHTML = `
    <div class="flex flex-col lg:flex-row gap-6 items-start">
        <!-- Barra lateral de guias (agrupada pelas pastas do manual) -->
        <nav id="docNav" class="w-full lg:w-64 flex-shrink-0 bg-white rounded-xl border border-gray-200/70 shadow-sm p-3 lg:sticky lg:top-4 lg:max-h-[85vh] overflow-y-auto text-sm">
            <p class="text-xs text-gray-400 px-2 py-3">A carregar guias…</p>
        </nav>
        <!-- Conteúdo do documento -->
        <div class="flex-1 min-w-0 bg-white rounded-xl border border-gray-200/70 shadow-sm p-6 md:p-8">
            <div id="docContent" class="text-gray-500">Carregando…</div>
        </div>
    </div>
`;

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Resolve um caminho relativo (rel) a partir da pasta do doc atual (baseDir).
function resolvePath(baseDir, rel) {
    const parts = baseDir ? baseDir.split('/') : [];
    for (const seg of rel.split('/')) {
        if (seg === '..') parts.pop();
        else if (seg !== '.' && seg !== '') parts.push(seg);
    }
    return parts.join('/');
}

// A barra lateral é montada a partir da própria docs/user/index.md (fonte única):
// cada "## Título" vira um grupo; cada link [label](x.md) vira um item.
async function buildNav(activePath) {
    const nav = document.getElementById('docNav');
    try {
        const md = await (await fetch('/docs/user/index.md', { cache: 'no-store' })).text();
        const groups = [];
        let cur = null;
        for (const raw of md.split('\n')) {
            const line = raw.trim();
            const h = line.match(/^##\s+(.+)/);
            if (h) { cur = { title: h[1].replace(/[*_`#]/g, '').trim(), items: [] }; groups.push(cur); continue; }
            if (!cur) continue;
            const linkRe = /\[([^\]]+)\]\(([^)]+\.md)\)/g;
            let m;
            while ((m = linkRe.exec(line))) {
                const rel = m[2].replace(/[?#].*$/, '');
                if (/^https?:/.test(rel)) continue;
                cur.items.push({ label: m[1], path: resolvePath('user', rel) });
            }
        }
        const withItems = groups.filter(g => g.items.length);
        if (!withItems.length) { nav.innerHTML = ''; return; }
        nav.innerHTML = `<a href="docs.html?doc=user/index.md" class="block px-2 py-1.5 mb-2 rounded text-sky-600 hover:bg-sky-50 font-medium"><i class="fas fa-book text-xs mr-1"></i> Índice do manual</a>`
            + withItems.map(g => `
                <div class="mb-3">
                    <p class="text-[10px] uppercase tracking-wider font-bold text-gray-400 px-2 mb-1">${esc(g.title)}</p>
                    ${g.items.map(it => `
                        <a href="docs.html?doc=${encodeURIComponent(it.path)}"
                           class="block px-2 py-1.5 rounded ${it.path === activePath ? 'bg-sky-50 text-sky-700 font-medium' : 'text-gray-600 hover:bg-gray-50 hover:text-gray-900'}">${esc(it.label)}</a>`).join('')}
                </div>`).join('');
    } catch (_) {
        nav.innerHTML = '<a href="docs.html?doc=user/index.md" class="block px-2 py-1.5 text-sky-600">Índice do manual</a>';
    }
}

async function loadDoc(docPath) {
    docPath = (docPath || 'user/index.md').replace(/^\/+/, '');
    if (docPath.includes('..') || !/^user\/[\w./-]+\.md$/.test(docPath)) docPath = 'user/index.md';

    buildNav(docPath); // (re)monta a barra lateral com o item ativo

    const content = document.getElementById('docContent');
    try {
        const res = await fetch('/docs/' + docPath, { cache: 'no-store' });
        if (!res.ok) throw new Error('Documento não encontrado (' + res.status + ')');
        const md = await res.text();
        const dir = docPath.split('/').slice(0, -1).join('/');

        const tmp = document.createElement('div');
        tmp.innerHTML = marked.parse(md);
        tmp.querySelectorAll('img').forEach(img => {
            const src = img.getAttribute('src') || '';
            if (!/^(https?:)?\//.test(src)) img.setAttribute('src', '/docs/' + resolvePath(dir, src));
        });
        tmp.querySelectorAll('a').forEach(a => {
            const href = a.getAttribute('href') || '';
            if (/^https?:/.test(href) || href.startsWith('#')) return;
            const clean = href.replace(/[?#].*$/, '');
            if (/\.md$/.test(clean)) a.setAttribute('href', 'docs.html?doc=' + encodeURIComponent(resolvePath(dir, clean)));
        });
        content.innerHTML = tmp.innerHTML;
        window.scrollTo(0, 0);
    } catch (err) {
        content.innerHTML = `<p class="text-red-500">${esc(err.message)}</p>
            <p class="text-xs text-gray-400 mt-2">Se acabou de publicar, confirme que a pasta <code>docs/</code> está a ser servida (ver vercel.json).</p>`;
    }
}

loadDoc(new URLSearchParams(location.search).get('doc'));
</script>
</body>
</html>
